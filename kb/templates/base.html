<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Base{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/ui">Knowledge Base</a>
    {% if not hide_nav %}
    <nav>
      <a href="{{ '/ui'|keep_filters(request) }}">Items</a>
      <a href="{{ '/ui/search'|keep_filters(request) }}">Search</a>
      <a href="/ui/taxonomy">Taxonomy</a>
      <a href="/docs">API</a>
      <form method="post" action="/ui/logout"><button class="link">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
